name = "mowaamah-ai"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
DAILY_LIMIT = "12"
SEARCH_DAILY_LIMIT = "3"
MODEL = "@cf/meta/llama-3.1-8b-instruct"
# Before public deployment, create a KV namespace and uncomment:
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
# Add TAVILY_API_KEY as a secret if you want live web search.
