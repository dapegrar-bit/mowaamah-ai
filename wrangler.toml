
name = "mowaamah-ai"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Workers AI
[ai]
binding = "AI"

# Website assets
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Free daily limits
[vars]
DAILY_LIMIT = "12"
SEARCH_DAILY_LIMIT = "3"

# AI model
MODEL = "@cf/google/gemma-4-26b-a4b-it"

# KV database
[[kv_namespaces]]
binding = "LIMITS"
id = "7269a14cb43f4ecaafcdaeb11bf9605d"
