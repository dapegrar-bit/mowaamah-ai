<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تفاصيل البرنامج | مواءمة AI</title>
  <link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest"></head>
<body><a class="skip-link" href="#main-content">الانتقال إلى المحتوى</a>
  <header class="topbar">
    <div class="container inner">
      <a class="brand" href="/"><img class="brand-logo" src="/assets/moaamah-logo.jpg" alt="شعار مواءمة"><div>مواءمة AI<small>تفاصيل برامج مواءمة</small></div></a>
      <nav class="nav">
        <a href="/">الرئيسية</a>
        <a href="/chat.html">المحادثة</a>
        <a class="active" href="/programs.html">البرامج</a><a href="/about.html">من نحن</a><a href="/faq.html">الأسئلة الشائعة</a>
      </nav>
      <a class="btn btn-primary" id="ask-btn" href="/chat.html">اسأل مواءمة عن البرنامج</a>
    </div>
  </header>

  <main id="main-content" class="section" style="padding-top:40px">
    <div class="container" id="detail-root"></div>
  </main>

  <footer class="footer"><div class="container footer-inner"><div>مواءمة AI</div><a href="/programs.html">عودة إلى البرامج</a></div><div class="container utility-links" style="margin-top:14px"><a href="/about.html">من نحن</a><a href="/faq.html">الأسئلة الشائعة</a><a href="/contact.html">تواصل معنا</a><a href="/privacy.html">الخصوصية</a></div></footer>
  <script src="/data/programs.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug');
    const program = (window.MOWAAMAH_PROGRAMS || []).find(p => p.slug === slug);
    const root = document.getElementById('detail-root');
    const askBtn = document.getElementById('ask-btn');
    if (!program) {
      root.innerHTML = '<div class="panel empty-state">البرنامج المطلوب غير موجود. <br><a href="/programs.html">العودة إلى صفحة البرامج</a></div>';
    } else {
      document.title = program.shortName + ' | مواءمة AI';
      askBtn.href = '/chat.html?program=' + encodeURIComponent(program.slug);
      askBtn.textContent = 'اسأل مواءمة عن ' + program.shortName;
      root.innerHTML = `
      <div class="program-detail-hero">
        <section class="panel hero-panel">
          <span class="kicker" style="color:var(--text);background:#f5f4fb;border-color:var(--line)">تفاصيل البرنامج</span>
          <h2 style="color:${program.accentDark}">${program.name}</h2>
          <p>${program.summary}</p>
          <div class="tool-row">
            <span class="toolbar-chip">30 ساعة تأهيل مهني تطبيقي</span>
            <span class="toolbar-chip">عن بُعد</span>
            <span class="toolbar-chip">مسائي</span>
            <span class="toolbar-chip">MAPC</span>
          </div>
        </section>
        <aside class="panel" style="padding:24px;display:grid;align-content:center;gap:16px">
          <div class="badge-circle" style="--accent:${program.accent};margin-inline:auto">${program.badge}</div>
          <div style="text-align:center">
            <h3 style="margin:0 0 8px">الفئات</h3>
            <div class="tagline" style="justify-content:center">
              <span class="chip">الطلاب</span>
              <span class="chip">الخريجون</span>
              <span class="chip">الباحثون عن عمل</span>
              <span class="chip">الموظفون</span>
            </div>
          </div>
        </aside>
      </div>
      <div class="section-title" style="margin-top:26px"><div><h2>ماذا ستتعلم؟</h2><p>محتوى البرنامج الأساسي والتخصصي، ويمكنك تعديله لاحقًا من ملف البيانات.</p></div></div>
      <div class="highlight-grid">
        <section class="panel" style="padding:22px">
          <h3 style="margin-top:0;color:${program.accentDark}">الموضوعات</h3>
          <div class="list-grid">${program.learn.map(x=>`<div class="list-card">${x}</div>`).join('')}</div>
        </section>
        <section class="panel" style="padding:22px">
          <h3 style="margin-top:0;color:${program.accentDark}">ماذا ستستفيد؟</h3>
          <div class="list-grid">${program.outcomes.map(x=>`<div class="list-card">${x}</div>`).join('')}</div>
        </section>
      </div>
      <div class="section-title" style="margin-top:26px"><div><h2>فئات التسجيل</h2><p>تمثيل تسويقي مبسط للفئة الأساسية والفئة الاحترافية.</p></div></div>
      <div class="pricing">
        <div class="price-box"><h3>الفئة الأساسية</h3><div class="price">مجانا</div><div class="price-list">${program.freeTier.map(x=>`<div class="price-item">✓ ${x}</div>`).join('')}</div></div>
        <div class="price-box pro" style="background:linear-gradient(135deg,${program.accentDark},${program.accent})"><h3>الفئة الاحترافية</h3><div class="price">195 <small>ريال</small></div><div class="price-list">${program.proTier.map(x=>`<div class="price-item">✓ ${x}</div>`).join('')}</div></div>
      </div>`;
    }
  </script>
<div class="toast" id="toast" role="status" aria-live="polite"></div><script src="/site.js"></script></body>
</html>
